services:

  # ==========================================
  # Nginx - Web Server
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: ticket_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ticket_network

  # ==========================================
  # PHP-FPM - Menjalankan CI4
  # ==========================================
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ticket_php
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      - database.default.hostname=mysql
      - database.default.database=database_kochi
      - database.default.username=root
      - database.default.password=root
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
      - WEBSOCKET_HOST=websocket
      - WEBSOCKET_PUSH_PORT=8090
      
    depends_on:
      - mysql
    networks:
      - ticket_network

  # ==========================================
  # WebSocket Server - Proses Terpisah
  # ==========================================
  websocket:
    build:
      context: .
      dockerfile: docker/websocket/Dockerfile
    container_name: ticket_websocket
    ports:
      - "8081:8081"
    volumes:
      - ./:/var/www/html
      
    environment:
      - database.default.hostname=mysql
      - database.default.database=database_kochi
      - database.default.username=root
      - database.default.password=root
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
    depends_on:
      - mysql
    networks:
      - ticket_network
    restart: unless-stopped

  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: ticket_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=database_kochi
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - ticket_network

  # ==========================================
  # phpMyAdmin (opsional, biar gampang lihat DB)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ticket_phpmyadmin
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - ticket_network

networks:
  ticket_network:
    driver: bridge

volumes:
  mysql_data: